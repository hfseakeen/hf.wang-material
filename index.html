
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>王海锋的作品集 WANG HAIFENG'S PORTFOLIO</title>
  
  <!-- 🇨🇳 CHINA OPTIMIZATION: Using fonts.font.im mirror instead of fonts.googleapis.com -->
  <link rel="preconnect" href="https://fonts.font.im">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.font.im/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Inter:wght@300;400;500;600;700&family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+SC:wght@700;900&display=swap"
    rel="stylesheet">
  
  <!-- 修复关键：添加 Tailwind CSS CDN，让样式立即生效 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'albert-black': ['"MiSans Global"', '"MiSans"', 'system-ui', 'sans-serif'],
            'albert-bold': ['"MiSans Global"', '"MiSans"', 'system-ui', 'sans-serif'],
            'albert-semibold': ['"MiSans Global"', '"MiSans"', 'system-ui', 'sans-serif'],
            'albert-regular': ['"MiSans Global"', '"MiSans"', 'system-ui', 'sans-serif'],
            'albert-light': ['"MiSans Global"', '"MiSans"', 'system-ui', 'sans-serif'],
            'hanchanyuanyuan': ['"MiSans Global"', '"MiSans"', 'system-ui', 'sans-serif'],
            'franklin-cond': ['"MiSans Global"', '"MiSans"', 'system-ui', 'sans-serif'],
            'opposans': ['"MiSans Global"', '"MiSans"', 'system-ui', 'sans-serif'],
            'arizonia': ['"MiSans Global"', '"MiSans"', 'system-ui', 'sans-serif'],
            'siyuan': ['"MiSans Global"', '"MiSans"', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    /* Font definitions for MiSans Global */
    body {
      font-family: 'MiSans Global', 'MiSans', system-ui, sans-serif;
      background-color: #ffffff;
      /* Pure white base */
      color: #000000;
      overflow-x: hidden;
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Scrollbar hiding for cleaner look */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #fff;
    }

    ::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }

    .font-albert-black {
      font-family: 'MiSans Global', 'MiSans', system-ui, sans-serif;
      font-weight: 900;
    }

    .font-albert-semibold {
      font-family: 'MiSans Global', 'MiSans', system-ui, sans-serif;
      font-weight: 600;
    }

    .font-albert-regular {
      font-family: 'MiSans Global', 'MiSans', system-ui, sans-serif;
      font-weight: 400;
    }

    .font-albert-light {
      font-family: 'MiSans Global', 'MiSans', system-ui, sans-serif;
      font-weight: 300;
    }

    /* Simulated HanChanTuanYuan with a rounded font fallback */
    .font-hanchanyuanyuan {
      font-family: 'MiSans Global', 'MiSans', system-ui, sans-serif;
      font-weight: 800;
    }

    .perspective-1000 {
      perspective: 1000px;
    }

    .perspective-2000 {
      perspective: 2000px;
    }

    .preserve-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
  
<!-- 保持 ImportMap 以便在当前环境正常运行 React -->
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <!-- IMPORTANT: This script tag links your HTML to the React code -->
  <script type="module" src="/index.tsx"></script>
</body>

</html>
